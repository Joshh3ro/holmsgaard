name: holmsgaard

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${HOLMSGAARD_SA_PASSWORD:?Set HOLMSGAARD_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Holmsgaard.ApiService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__HOLMSGAARD_CONTEXT: Server=sqlserver,1433;Database=Holmsgaard;User Id=sa;Password=${HOLMSGAARD_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True
      # Double underscore maps to the ASP.NET Core configuration key Jwt:Key.
      Jwt__Key: ${HOLMSGAARD_JWT_SIGNING_KEY:?Set HOLMSGAARD_JWT_SIGNING_KEY in .env}
      Jwt__Issuer: Holmsgaard.Api
      Jwt__Audience: Holmsgaard.Web
      Database__ApplyMigrations: "true"
    ports:
      - "5510:8080"
    volumes:
      - api-data-protection:/root/.aspnet/DataProtection-Keys
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Holmsgaard.Web/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__cache: redis:6379
      Services__ApiBaseUrl: http://api:8080/
    ports:
      - "5206:8080"
    volumes:
      - web-data-protection:/root/.aspnet/DataProtection-Keys
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver-data:
  redis-data:
  api-data-protection:
  web-data-protection:
